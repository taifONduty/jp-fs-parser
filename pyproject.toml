[project]
name = "jpfs"
version = "0.1.0"
description = "Parse pages of Japanese financial-statement PDFs into verified tables of typed facts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11"]

[project.scripts]
jpfs = "jpfs.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # full-width punctuation is the domain, not a typo

[tool.pytest.ini_options]
testpaths = ["tests"]
